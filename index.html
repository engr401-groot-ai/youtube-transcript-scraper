<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>UH Mentions Search v1.0</title>
        <style>
            body { font-family: system-ui, sans-serif; margin: 24px; }
            body.modal-open { overflow: hidden; height: 100vh; }
            input { width: 360px; padding: 8px; }
            button { padding: 8px 12px; margin-left: 6px; }
            .card { border: 1px solid #ddd; border-radius: 8px; padding: 12px; margin: 10px 0; }
            .meta { color: #666; font-size: 0.9em; margin-bottom: 6px; }
            .text { white-space: pre-wrap; }
            .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 24px; }
            .modal { background: white; border-radius: 10px; max-width: 1000px; width: 95%; max-height: 80vh; overflow: hidden; box-shadow: 0 12px 36px rgba(0,0,0,0.25); }
            .modal-header { padding: 12px 16px; border-bottom: 1px solid #eee; display:flex; justify-content:space-between; align-items:center; }
            .modal-body { padding: 12px 16px; display: flex; flex-direction: column; gap: 12px; }
            .keywords-row { border: 1px solid #ddd; padding: 12px; white-space: normal; overflow-y: auto; max-height: 44vh; word-break: break-word; }
            .keyword-suggest { display:flex; gap:8px; align-items:center; }
            .keyword-suggest input[type="text"] { flex: 1 1 auto; padding: 8px; }
            .kw-action { width: 88px; }
        </style>
    </head>
    <body>
        <div id="page-content">

            <h2>UH Mentions Search v1.0</h2>
            <p>Search explicit UH mention segments across transcribed hearing videos.</p>

            <!-- Tabs -->
            <div style="margin-bottom: 12px;">
                <button id="tab-mentions-btn" onclick="showMentionsTab()" disabled>Mentions</button>
                <button id="keywords-btn" onclick="openKeywordsModal()" title="Show keywords">Keywords</button>
                <button id="settings-btn" onclick="openSettingsModal()" title="Notification Settings">Settings</button>
            </div>

            <div style="margin-bottom: 12px;">
                <input id="q_shared" placeholder="Search mentions (e.g., board of regents, mauna kea)" style="width:420px;" />
                <button onclick="doSearch()">Search</button>
                <button onclick="clearSearch()">Clear</button>
                <span id="status_mentions" style="margin-left: 12px;"></span>
            </div>

            <div id="mentions-tab">
                <div id="results"></div>
            </div>

            <script>
                let allMentions = [];
                const NOTIFICATION_SYSTEM_SERVER = 'https://notification-system-server-655654578945.us-west1.run.app';

                function showMentionsTab() {
                    document.getElementById('mentions-tab').style.display = '';
                    document.getElementById('tab-mentions-btn').disabled = true;

                    const el = document.getElementById('q_shared');
                    if (el) el.placeholder = 'Search mentions (e.g., board of regents, mauna kea)';

                    const sm = document.getElementById('status_mentions');
                    if (sm) sm.style.display = '';

                    if (allMentions && allMentions.length > 0) {
                        renderMentions(allMentions);
                    } else {
                        loadMentionsDefault();
                    }
                }

                async function runMentionSearch() {
                    const q = document.getElementById("q_shared").value.trim();
                    if (!q) return;
                    document.getElementById("status_mentions").textContent = " searching...";

                    const res = await fetch(`/search?q=${encodeURIComponent(q)}&limit=50`);
                    const data = await res.json();

                    document.getElementById("status_mentions").textContent = ` ${data.count} results`;

                    const root = document.getElementById("results");
                    root.innerHTML = "";
                    for (const r of data.results) {
                        const div = document.createElement("div");
                        div.className = "card";
                        div.innerHTML = `
                            <div class="meta"><b>${r.video_name || r.video_id}</b></div>
                            <div class="meta">keyword: <code>${r.keyword}</code> • start: ${r.start_sec}s</div>
                            <div class="text">${r.text}</div>
                            <div><a href="/video/${r.video_id}/view?t=${Math.floor(r.start_sec)}" target="_blank">View Video</a></div>
                        `;
                        root.appendChild(div);
                    }
                }

                async function loadMentionsDefault() {
                    const st = document.getElementById('status_mentions');
                    if (st) st.textContent = '';

                    try {
                        const resp = await fetch(`/list_mentions?limit=100`);
                        const data = await resp.json();
                        const root = document.getElementById('results');
                        root.innerHTML = '';

                        const items = data.results || [];
                        allMentions = items.slice();

                        for (const r of items) {
                            const div = document.createElement('div');
                            div.className = 'card';
                            div.innerHTML = `
                                <div class="meta"><b>${r.video_name || r.video_id}</b></div>
                                <div class="meta">keyword: <code>${r.keyword || ''}</code> • start: ${r.start_sec}s</div>
                                <div class="text">${r.text || ''}</div>
                                <div><a href="/video/${r.video_id}/view?t=${Math.floor(r.start_sec)}" target="_blank">View Video</a></div>
                            `;
                            root.appendChild(div);
                        }

                        if (st) st.textContent = ` ${items.length} results`;

                    } catch (err) {
                        if (st) st.textContent = ' error loading mentions';
                        console.error('loadMentionsDefault error', err);
                    }
                }

                function renderMentions(items) {
                    const root = document.getElementById('results');
                    root.innerHTML = '';

                    for (const r of items) {
                        const div = document.createElement('div');
                        div.className = 'card';
                        div.innerHTML = `
                            <div class="meta"><b>${r.video_name || r.video_id}</b></div>
                            <div class="meta">keyword: <code>${r.keyword || ''}</code> • start: ${r.start_sec}s</div>
                            <div class="text">${r.text || ''}</div>
                            <div><a href="/video/${r.video_id}/view?t=${Math.floor(r.start_sec)}" target="_blank">View Video</a></div>
                        `;
                        root.appendChild(div);
                    }

                    const st = document.getElementById('status_mentions');
                    if (st) st.textContent = ` ${items.length} results`;
                }

                function doSearch() {
                    runMentionSearch();
                }

                function clearSearch() {
                    const el = document.getElementById('q_shared');
                    if (el) el.value = '';

                    if (allMentions && allMentions.length > 0) {
                        renderMentions(allMentions);
                    } else {
                        loadMentionsDefault();
                    }
                }

                async function openKeywordsModal() {
                    const overlay = document.getElementById('keywords-modal-overlay');
                    if (!overlay) return;
                    overlay.style.display = 'flex';

                    try { document.body.classList.add('modal-open'); } catch (e) {}
                    try { document.getElementById('page-content').setAttribute('aria-hidden', 'true'); } catch (e) {}

                    fetch('/keywords')
                        .then(r => r.json())
                        .then(data => {
                            const listEl = document.getElementById('keywords-list');
                            const selectEl = document.getElementById('keywords-delete-select');
                            listEl.textContent = data.keywords.join(', ');
                            document.getElementById('keywords-count').textContent = `${data.keywords.length} keywords`;

                            // Populate delete dropdown 
                            if (selectEl) {
                                selectEl.innerHTML = '<option value="" disabled selected>Select keyword to delete</option>';
                                for (const kw of data.keywords) {
                                    const opt = document.createElement('option');
                                    opt.value = kw;
                                    opt.textContent = kw;
                                    selectEl.appendChild(opt);
                                }
                            }
                        });

                    setTimeout(() => {
                        const inp = document.getElementById('keyword-suggest-input');
                        if (inp) inp.focus();
                    }, 120);
                }

                function closeKeywordsModal() {
                    document.getElementById('keywords-modal-overlay').style.display = 'none';
                    document.body.classList.remove('modal-open');
                    document.getElementById('page-content').removeAttribute('aria-hidden');
                }

                function _showKeywordStatus(msg, type) {
                    // type: 'loading' | 'success' | 'error' | 'info'
                    const el = document.getElementById('keyword-action-status');
                    if (!el) return;
                    el.textContent = msg || '';
                    el.style.opacity = '1';
                    switch (type) {
                        case 'loading':
                            el.style.color = '#333';
                            break;
                        case 'success':
                            el.style.color = '#0a7';
                            break;
                        case 'error':
                            el.style.color = '#e44';
                            break;
                        default:
                            el.style.color = '#333';
                    }
                }

                function _clearKeywordStatus(afterMs = 3000) {
                    const el = document.getElementById('keyword-action-status');
                    if (!el) return;
                    if (afterMs <= 0) {
                        el.textContent = '';
                        return;
                    }
                    setTimeout(() => { el.textContent = ''; }, afterMs);
                }

                function _setKeywordControlsDisabled(disabled) {
                    const inp = document.getElementById('keyword-suggest-input');
                    const addBtn = document.getElementById('keyword-add-btn');
                    const delBtn = document.getElementById('keyword-delete-btn');
                    const selectEl = document.getElementById('keywords-delete-select');
                    if (inp) inp.disabled = !!disabled;
                    if (addBtn) addBtn.disabled = !!disabled;
                    if (delBtn) delBtn.disabled = !!disabled;
                    if (selectEl) selectEl.disabled = !!disabled;
                }

                async function addKeyword(e) {
                    if (e && e.preventDefault) e.preventDefault();
                    const inp = document.getElementById('keyword-suggest-input');
                    if (!inp) return;
                    const kw = inp.value.trim();
                    if (!kw) return;

                    _setKeywordControlsDisabled(true);
                    const addBtn = document.getElementById('keyword-add-btn');
                    const origAddText = addBtn ? addBtn.innerText : null;
                    if (addBtn) addBtn.innerText = 'Adding...';
                    _showKeywordStatus('Adding keyword...', 'loading');

                    try {
                        const resp = await fetch('/keywords', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ keyword: kw }),
                        });
                        if (!resp.ok) {
                            _showKeywordStatus('Failed to add keyword', 'error');
                            _clearKeywordStatus(5000);
                            return;
                        }
                        const data = await resp.json();
                        // Update UI
                        document.getElementById('keywords-list').textContent = data.keywords.join(', ');
                        document.getElementById('keywords-count').textContent = `${data.keywords.length} keywords`;
                        const selectEl = document.getElementById('keywords-delete-select');
                        if (selectEl) {
                            selectEl.innerHTML = '<option value="" disabled selected>Select keyword to delete</option>';
                            for (const kw2 of data.keywords) {
                                const opt = document.createElement('option');
                                opt.value = kw2;
                                opt.textContent = kw2;
                                selectEl.appendChild(opt);
                            }
                        }
                        inp.value = '';
                        inp.focus();

                        _showKeywordStatus(`Added "${kw}"`, 'success');
                        _clearKeywordStatus(3000);

                    } catch (err) {
                        console.error('addKeyword error', err);
                        _showKeywordStatus('Failed to add keyword', 'error');
                        _clearKeywordStatus(5000);
                    } finally {
                        if (addBtn && origAddText) addBtn.innerText = origAddText;
                        _setKeywordControlsDisabled(false);
                    }
                }

                async function deleteKeyword() {
                    const selectEl = document.getElementById('keywords-delete-select');
                    if (!selectEl) return;
                    const kw = selectEl.value;
                    if (!kw) return;

                    if (!confirm(`Delete keyword "${kw}"?`)) return;

                    _setKeywordControlsDisabled(true);
                    const delBtn = document.getElementById('keyword-delete-btn');
                    const origDelText = delBtn ? delBtn.innerText : null;
                    if (delBtn) delBtn.innerText = 'Deleting...';
                    _showKeywordStatus('Deleting keyword...', 'loading');

                    try {
                        const resp = await fetch(`/keywords?keyword=${encodeURIComponent(kw)}`, { method: 'DELETE' });
                        if (!resp.ok) {
                            _showKeywordStatus('Failed to delete keyword', 'error');
                            _clearKeywordStatus(5000);
                            return;
                        }
                        const data = await resp.json();
                        document.getElementById('keywords-list').textContent = data.keywords.join(', ');
                        document.getElementById('keywords-count').textContent = `${data.keywords.length} keywords`;
                        selectEl.innerHTML = '<option value="" disabled selected>Select keyword to delete</option>';
                        for (const kw2 of data.keywords) {
                            const opt = document.createElement('option');
                            opt.value = kw2;
                            opt.textContent = kw2;
                            selectEl.appendChild(opt);
                        }

                        _showKeywordStatus(`Deleted "${kw}"`, 'success');
                        _clearKeywordStatus(3000);
                    } catch (err) {
                        console.error('deleteKeyword error', err);
                        _showKeywordStatus('Failed to delete keyword', 'error');
                        _clearKeywordStatus(5000);
                    } finally {
                        if (delBtn && origDelText) delBtn.innerText = origDelText;
                        _setKeywordControlsDisabled(false);
                    }
                }

                async function openSettingsModal() {
                    const overlay = document.getElementById('settings-modal-overlay');
                    overlay.style.display = 'flex';
                    document.body.classList.add('modal-open');
                }

                function closeSettingsModal() {
                    document.getElementById('settings-modal-overlay').style.display = 'none';
                    document.body.classList.remove('modal-open');
                }

                // INIT
                showMentionsTab();
                loadMentionsDefault();
            </script>
        </div>

        <!-- Keywords Modal -->
        <div id="keywords-modal-overlay" class="modal-overlay">
            <div class="modal" role="dialog" aria-modal="true">
                <div class="modal-header">
                    <div id="keywords-count">0 keywords</div>
                    <div style="display:flex; align-items:center; gap:12px;">
                        <div id="keyword-action-status" style="min-width:160px; text-align:right; font-size:0.95em; color:#333;"></div>
                        <button onclick="closeKeywordsModal()">Close</button>
                    </div>
                </div>
                <div class="modal-body">
                    <div class="keywords-row" id="keywords-list">Loading...</div>

                    <form class="keyword-suggest" onsubmit="addKeyword(event)">
                        <input id="keyword-suggest-input" type="text" placeholder="Type keyword to add" />
                        <button id="keyword-add-btn" type="submit" class="kw-action">Add</button>
                    </form>

                    <div style="display:flex; gap:8px; align-items:center; margin-top:8px;">
                        <select id="keywords-delete-select" style="flex:1 1 auto; padding:8px;">
                            <option value="" disabled selected>Select keyword to delete</option>
                        </select>
                        <button id="keyword-delete-btn" type="button" class="kw-action" onclick="deleteKeyword()">Delete</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Settings Modal -->
        <div id="settings-modal-overlay" class="modal-overlay">
            <div class="modal">
                <div class="modal-header">
                    <h3>Notification Settings</h3>
                    <button onclick="closeSettingsModal()">Close</button>
                </div>
                <div class="modal-body">
                    <form id="settings-form">
                        <label>Recipients</label>
                        <input id="to-emails" type="text" style="width:100%;" />

                        <label>Sender</label>
                        <input id="sender" type="email" style="width:100%;" />

                        <label>Password</label>
                        <input id="password" type="text" style="width:100%;" />

                        <button type="button" onclick="closeSettingsModal()">Close</button>
                    </form>
                </div>
            </div>
        </div>
    </body>
</html>
